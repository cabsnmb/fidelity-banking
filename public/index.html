<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Fidelity Banking Ghana</title>
    <style>
        /* Reset & Base */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .splash {
            max-width: 480px;
            width: 100%;
            background: #ffffff;
            border-radius: 32px;
            padding: 48px 32px 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
            text-align: center;
            transition: all 0.2s;
        }

        /* Brand mark – red badge */
        .brand-badge {
            display: inline-block;
            background: #e11b22;
            color: #ffffff;
            font-weight: 700;
            font-size: 14px;
            letter-spacing: 2px;
            padding: 6px 18px;
            border-radius: 30px;
            text-transform: uppercase;
            margin-bottom: 24px;
        }

        /* Main brand name */
        .brand-name {
            font-size: 36px;
            font-weight: 700;
            color: #1a1a1a;
            line-height: 1.1;
            margin-bottom: 8px;
        }
        .brand-name span {
            color: #e11b22;
        }

        .tagline {
            font-size: 18px;
            color: #666666;
            margin-bottom: 12px;
            font-weight: 400;
        }

        .sub-tagline {
            font-size: 15px;
            color: #888888;
            margin-bottom: 40px;
            line-height: 1.5;
        }

        /* Gold accent line */
        .accent-line {
            width: 60px;
            height: 4px;
            background: #f5c518; /* Fidelity gold */
            border-radius: 4px;
            margin: 16px auto 28px;
        }

        /* Button */
        .btn-primary {
            display: inline-block;
            width: 100%;
            padding: 18px 0;
            background: #e11b22;
            color: #ffffff;
            border: none;
            border-radius: 999px;
            font-size: 18px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 8px 24px rgba(225, 27, 34, 0.25);
            letter-spacing: 0.5px;
        }
        .btn-primary:hover {
            background: #c9181f;
            transform: scale(1.01);
            box-shadow: 0 12px 32px rgba(225, 27, 34, 0.35);
        }
        .btn-primary:active {
            transform: scale(0.97);
        }

        /* Small footer note */
        .footer-note {
            margin-top: 28px;
            font-size: 13px;
            color: #aaaaaa;
        }

        /* Responsive */
        @media (max-width: 420px) {
            .splash {
                padding: 32px 20px 28px;
            }
            .brand-name {
                font-size: 28px;
            }
            .tagline {
                font-size: 16px;
            }
            .btn-primary {
                font-size: 16px;
                padding: 16px 0;
            }
        }
    </style>
</head>
<body>

    <div class="splash">
        <!-- Brand badge -->
        <div class="brand-badge">🏦 Ghana’s Bank</div>

        <!-- Main brand name -->
        <div class="brand-name">
            Fidelity <span>Banking</span>
        </div>
        <div class="brand-name" style="font-size:28px; margin-top:-6px; color:#e11b22;">
            Ghana
        </div>

        <!-- Gold accent -->
        <div class="accent-line"></div>

        <!-- Welcome messages -->
        <div class="tagline">Welcome to smarter banking</div>
        <div class="sub-tagline">
            Secure, simple, and built for you.<br />
            Let’s get started with your account.
        </div>

        <!-- Action button -->
        <a href="form.html" class="btn-primary">Get Started →</a>

        <div class="footer-note">
            © 2026 Fidelity Banking Ghana
        </div>
    </div>

</body>
</html>
