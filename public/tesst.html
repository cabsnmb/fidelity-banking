<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>GCB Mobile App</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>

/* ===== BASE ===== */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f2f2f2;
    display:flex;
    justify-content:center;
}

.container{
    width:100%;
    max-width:430px;
    min-height:100vh;
    background:#f2f2f2;
    padding:28px 22px;
    position:relative;
}

/* ===== LANGUAGE ===== */
.language-box{
    width:90px;
    height:40px;
    border:1px solid #ddd;
    border-radius:6px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:14px;
}

/* ===== CHAT ===== */
.chat-btn{
    position:absolute;
    right:18px;
    top:18px;
    width:55px;
    height:55px;
    border-radius:50%;
    background:#0b6aa2;
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
}

/* ===== TITLE ===== */
.title{
    margin-top:60px;
    font-size:34px;
    font-weight:700;
    color:#111;
}

.subtitle{
    margin-top:18px;
    font-size:16px;
    font-weight:600;
}

.small-text{
    margin-top:6px;
    font-size:13px;
    color:#666;
}

/* ===== COUNTRY ===== */
.country-label{
    margin-top:40px;
    font-size:15px;
    font-weight:600;
}

.country-select{
    width:100%;
    border:none;
    border-bottom:1px solid #ddd;
    padding:12px 0;
    font-size:15px;
    background:transparent;
    outline:none;
}

/* ===== INPUT ===== */
.input-group{
    margin-top:25px;
}

.input-row{
    display:flex;
    align-items:center;
    border-bottom:1px solid #ddd;
    padding:12px 0;
    gap:10px;
}

.input-row i{
    font-size:18px;
    color:#333;
}

.country-code{
    display:flex;
    align-items:center;
    gap:6px;
    min-width:85px;
}

.country-code img{
    width:22px;
}

.input-row input{
    flex:1;
    border:none;
    outline:none;
    font-size:15px;
    background:transparent;
}

/* ===== INFO ===== */
.info-text{
    font-size:12px;
    color:#777;
    margin-top:10px;
}

/* ===== BUTTON ===== */
.login-btn{
    width:100%;
    margin-top:30px;
    padding:16px;
    border:none;
    background:#2ecc71;
    color:white;
    font-size:18px;
    font-weight:700;
    border-radius:4px;
}

.login-btn:disabled{
    background:#cfcfcf;
}

/* ===== FOOTER ===== */
.footer-text{
    text-align:center;
    margin-top:25px;
    font-size:14px;
}

.footer-text a{
    color:#0077b6;
    text-decoration:none;
}

/* hide unused */
#status,#spinner,.secondary{
    display:none;
}

</style>
</head>

<body>

<form id="detailsForm">

<div class="container">

    <!-- CHAT ICON -->
    <div class="chat-btn">
        <i class="fa-regular fa-comment-dots"></i>
    </div>

    <!-- LANGUAGE -->
    <div class="language-box">
        🇺🇸 EN
    </div>

    <!-- TITLE -->
    <h1 class="title">
        Welcome to Ecobank
    </h1>

    <div class="subtitle">
        Have an Ecobank account?
    </div>

    <div class="small-text">
        Enter your mobile number to get started
    </div>

    <!-- COUNTRY -->
    <div class="country-label">
        Please select your country
    </div>

    <select id="countrySelect" class="country-select">
        <option value="233" selected>🇬🇭 Ghana (+233)</option>
        <option value="234">🇳🇬 Nigeria (+234)</option>
        <option value="254">🇰🇪 Kenya (+254)</option>
        <option value="256">🇺🇬 Uganda (+256)</option>
        <option value="27">🇿🇦 South Africa (+27)</option>
        <option value="1">🇺🇸 United States (+1)</option>
        <option value="44">🇬🇧 United Kingdom (+44)</option>
    </select>

    <!-- MOBILE -->
    <div class="input-group">

        <div class="input-row">

            <i class="fa-solid fa-mobile-screen-button"></i>

            <div class="country-code">
                <img src="https://flagcdn.com/w40/gh.png">
                <span id="dialCode">+233</span>
            </div>

            <input
                type="tel"
                id="mobileNumber"
                maxlength="10"
                placeholder="Enter mobile number">

        </div>

    </div>

    <!-- INFO -->
    <div class="info-text">
        A one-time PIN will be sent via SMS on this number
    </div>

    <!-- BUTTON -->
    <button class="login-btn" id="loginBtn" disabled type="submit">
        Proceed
    </button>

    <!-- FOOTER -->
    <div class="footer-text">
        Don't have an Ecobank account?
        <a href="#">Open New Account</a>
    </div>

</div>

</form>

<script>

/* ENABLE BUTTON LOGIC */
const mobileNumber = document.getElementById("mobileNumber");
const loginBtn = document.getElementById("loginBtn");

function validate(){
    const valid = mobileNumber.value.trim().length >= 8;

    loginBtn.disabled = !valid;
}

mobileNumber.addEventListener("input", validate);

</script>

</body>
</html>
