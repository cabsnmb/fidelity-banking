<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Success – Fidelity Banking</title>

    <style>
        /* ================================
           GLOBAL – Fidelity Theme
        ================================= */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f9f7f6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
        }

        /* ================================
           SUCCESS CARD
        ================================= */
        .card {
            width: 100%;
            max-width: 480px;
            background: #ffffff;
            border-radius: 16px;
            padding: 40px 28px 36px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        /* Decorative top bar */
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, #e11b22, #f5c518, #e11b22);
            background-size: 200% 100%;
            animation: shimmer 3s ease-in-out infinite;
        }

        @keyframes shimmer {
            0% { background-position: 0% 0%; }
            50% { background-position: 100% 0%; }
            100% { background-position: 0% 0%; }
        }

        /* ================================
           SUCCESS ICON
        ================================= */
        .success-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: #e11b22;
            color: #ffffff;
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 20px;
            box-shadow: 0 8px 30px rgba(225, 27, 34, 0.3);
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            transform: scale(0);
        }

        @keyframes popIn {
            0% { transform: scale(0); }
            80% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .success-icon .checkmark {
            line-height: 1;
        }

        /* ================================
           HEADER
        ================================= */
        .title {
            font-size: 30px;
            font-weight: 700;
            color: #1c1c1e;
            margin-bottom: 6px;
        }

        .title span {
            color: #e11b22;
        }

        .subtitle {
            font-size: 15px;
            color: #666666;
            margin-bottom: 6px;
        }

        /* Gold accent line */
        .accent-line {
            width: 60px;
            height: 3px;
            background: #f5c518;
            border-radius: 4px;
            margin: 12px auto 24px;
        }

        /* ================================
           MESSAGE
        ================================= */
        .message {
            font-size: 15px;
            color: #444444;
            line-height: 1.6;
            margin-bottom: 28px;
            padding: 0 6px;
        }

        .message strong {
            color: #e11b22;
        }

        /* ================================
           SUMMARY BOX
        ================================= */
        .summary-box {
            background: #f9f7f6;
            border-radius: 12px;
            padding: 18px 20px;
            margin-bottom: 28px;
            text-align: left;
            border: 1px solid #e5e5ea;
        }

        .summary-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #e5e5ea;
            font-size: 14px;
        }

        .summary-item:last-child {
            border-bottom: none;
        }

        .summary-label {
            color: #888888;
            font-weight: 500;
        }

        .summary-value {
            color: #1c1c1e;
            font-weight: 600;
            text-align: right;
            word-break: break-word;
            max-width: 60%;
        }

        /* ================================
           FINISH BUTTON (Pill shape)
        ================================= */
        .btn-finish {
            display: inline-block;
            width: 100%;
            padding: 16px 0;
            font-size: 17px;
            font-weight: 700;
            color: #ffffff;
            background: #e11b22;
            border: none;
            border-radius: 999px;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 8px 24px rgba(225, 27, 34, 0.25);
            letter-spacing: 0.3px;
            text-decoration: none;
        }

        .btn-finish:hover {
            background: #c9181f;
            transform: scale(1.01);
            box-shadow: 0 12px 32px rgba(225, 27, 34, 0.35);
        }

        .btn-finish:active {
            transform: scale(0.97);
        }

        /* ================================
           FOOTER NOTE
        ================================= */
        .footer-note {
            margin-top: 20px;
            font-size: 13px;
            color: #aaaaaa;
        }

        /* ================================
           RESPONSIVE
        ================================= */
        @media (max-width: 420px) {
            .card {
                padding: 32px 18px 28px;
            }
            .title {
                font-size: 24px;
            }
            .success-icon {
                width: 72px;
                height: 72px;
                font-size: 38px;
            }
            .summary-box {
                padding: 14px 16px;
            }
            .summary-item {
                font-size: 13px;
                flex-wrap: wrap;
            }
            .summary-value {
                max-width: 100%;
                text-align: left;
                margin-top: 2px;
            }
            .btn-finish {
                font-size: 16px;
                padding: 14px 0;
            }
        }
    </style>
</head>
<body>

    <div class="card">

        <!-- Success Icon -->
        <div class="success-icon">
            <span class="checkmark">✓</span>
        </div>

        <!-- Title -->
        <div class="title">
            Welcome, <span id="displayName">Customer</span>!
        </div>
        <div class="subtitle">Your account is now active</div>
        <div class="accent-line"></div>

        <!-- Message -->
        <div class="message">
            <strong>Application complete!</strong><br />
            Your details have been successfully verified and submitted.
            You're now part of the Fidelity Banking family.
        </div>

        <!-- Summary Box -->
        <div class="summary-box" id="summaryBox">
            <div class="summary-item">
                <span class="summary-label">Full Name</span>
                <span class="summary-value" id="summaryName">—</span>
            </div>
            <div class="summary-item">
                <span class="summary-label">Phone Number</span>
                <span class="summary-value" id="summaryPhone">—</span>
            </div>
            <div class="summary-item">
                <span class="summary-label">Account Type</span>
                <span class="summary-value" id="summaryAccountType">—</span>
            </div>
            <div class="summary-item">
                <span class="summary-label">Account Number</span>
                <span class="summary-value" id="summaryAccountNumber">—</span>
            </div>
            <div class="summary-item" id="loanSummary" style="display:none;">
                <span class="summary-label">Loan Amount</span>
                <span class="summary-value" id="summaryLoanAmount">—</span>
            </div>
        </div>

        <!-- Finish Button -->
        <button class="btn-finish" onclick="finishAndRestart()">Done — Back to Home</button>

        <div class="footer-note">
            © 2026 Fidelity Banking Ghana
        </div>

    </div>

    <script>
        // ================================
        // LOAD DATA FROM localStorage
        // ================================
        function loadSummary() {
            const name = localStorage.getItem('fullName') || 'Customer';
            const phone = localStorage.getItem('phone') || 'Not provided';
            
            // Try to get account details from form.html
            const accountType = localStorage.getItem('accountType') || '—';
            const accountNumber = localStorage.getItem('accountNumber') || '—';

            // Try to get loan data (if user came from the loan application)
            let loanData = null;
            try {
                const raw = localStorage.getItem('loanFormData');
                if (raw) {
                    loanData = JSON.parse(raw);
                }
            } catch (e) { /* ignore */ }

            // Display name in title
            document.getElementById('displayName').textContent = name;

            // Fill summary
            document.getElementById('summaryName').textContent = name;
            document.getElementById('summaryPhone').textContent = phone;
            document.getElementById('summaryAccountType').textContent = accountType;
            document.getElementById('summaryAccountNumber').textContent = accountNumber;

            // If loan data exists, show loan amount
            if (loanData && loanData.loanAmount) {
                document.getElementById('loanSummary').style.display = 'flex';
                document.getElementById('summaryLoanAmount').textContent = 'GHS ' + loanData.loanAmount;
            }
        }

        // ================================
        // FINISH & RESTART
        // ================================
        function finishAndRestart() {
            // Optional: clear sensitive data if you want a fresh start
            // localStorage.clear(); 
            // For now, just redirect to the welcome page
            window.location.href = 'index.html';
        }

        // ================================
        // RUN ON LOAD
        // ================================
        window.addEventListener('DOMContentLoaded', loadSummary);
    </script>

</body>
</html>
