<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Existing Account Holders</title>

    <style>
        /* ================================
           GLOBAL STYLES
        ================================= */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            font-family: Arial, Helvetica, sans-serif;
            background: #ffffff;
        }

        body {
            padding-bottom: 90px;
        }


        /* ================================
           MAIN PAGE
        ================================= */
        .page {
            width: 100%;
            max-width: 700px;
            min-height: 100vh;
            margin: 0 auto;
            background: #f9f7f6;
        }


        /* ================================
           PAGE HEADER
        ================================= */
        .header {
            height: 70px;
            padding: 25px 20px;
            border-bottom: 1px solid #dddddd;

            color: #e85d32;
            font-size: 18px;
            font-weight: 500;
        }


        /* ================================
           FORM CARD
        ================================= */
        .form-card {
            margin: 20px 18px;
            min-height: 600px;
            padding: 28px 16px;

            background: #fcfcfc;

            box-shadow:
                0 2px 8px rgba(0, 0, 0, 0.12);
        }


        /* ================================
           FORM GROUP
        ================================= */
        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;

            margin-bottom: 9px;

            font-size: 16px;
            color: #444444;
        }


        /* ================================
           ACCOUNT TYPE DROPDOWN
        ================================= */
        .select-wrapper {
            position: relative;
            width: 100%;
        }

        .account-type-select {
            width: 100%;
            height: 64px;

            padding: 0 60px 0 85px;

            border: none;
            border-radius: 3px;

            background-color: #f45112;
            color: white;

            font-size: 20px;

            outline: none;
            cursor: pointer;

            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;

            box-shadow:
                0 2px 6px rgba(0, 0, 0, 0.25);
        }

        .account-type-select option {
            background: white;
            color: #333333;
            font-size: 18px;
        }


        /* Info Icon */
        .info-icon {
            position: absolute;
            z-index: 2;

            top: 8px;
            left: 15px;

            width: 48px;
            height: 48px;

            border: 3px solid rgba(255, 255, 255, 0.7);
            border-radius: 50%;

            color: rgba(255, 255, 255, 0.8);

            font-family: Georgia, serif;
            font-size: 34px;

            text-align: center;
            line-height: 43px;

            pointer-events: none;
        }


        /* Dropdown Arrow */
        .select-arrow {
            position: absolute;
            z-index: 2;

            top: 20px;
            right: 20px;

            color: white;
            font-size: 22px;

            pointer-events: none;
        }


        /* ================================
           TEXT INPUT FIELDS
        ================================= */
        input[type="tel"],
        input[type="text"] {
            width: 100%;
            height: 54px;

            padding: 0 12px;

            border: 1px solid #d4d4d4;
            border-radius: 8px;

            background: #ffffff;

            color: #444444;
            font-size: 17px;

            outline: none;

            box-shadow:
                0 2px 5px rgba(0, 0, 0, 0.12);
        }

        input[type="tel"]:focus,
        input[type="text"]:focus {
            border-color: #f45112;
        }

        input::placeholder {
            color: #888888;
            opacity: 1;
        }


        /* ================================
           SWITCH OPTIONS
        ================================= */
        .options {
            margin-top: 100px;
        }

        .option {
            display: flex;
            align-items: center;

            margin-bottom: 18px;
        }


        /* Toggle Switch */
        .switch {
            position: relative;

            width: 62px;
            height: 34px;

            margin-right: 12px;

            flex-shrink: 0;
        }

        .switch input {
            display: none;
        }

        .slider {
            position: absolute;

            top: 0;
            left: 0;
            right: 0;
            bottom: 0;

            background-color: #b9aeaa;

            border-radius: 30px;

            cursor: pointer;

            transition: 0.3s;
        }

        .slider::before {
            content: "";

            position: absolute;

            width: 29px;
            height: 29px;

            top: 2.5px;
            left: 3px;

            background-color: #f2ece9;

            border-radius: 50%;

            transition: 0.3s;

            box-shadow:
                0 1px 4px rgba(0, 0, 0, 0.2);
        }

        .switch input:checked + .slider {
            background-color: #f45112;
        }

        .switch input:checked + .slider::before {
            transform: translateX(27px);
        }


        /* ================================
           OPTION TEXT
        ================================= */
        .option-text {
            font-size: 16px;
            font-weight: 600;
            color: #3e3e3e;
        }

        .link {
            color: #343434;
            text-decoration: underline;
            cursor: pointer;
        }


        /* ================================
           BOTTOM BUTTON AREA
        ================================= */
        .bottom-bar {
            position: fixed;

            bottom: 0;
            left: 50%;

            transform: translateX(-50%);

            width: 100%;
            max-width: 700px;

            height: 90px;

            padding: 10px 18px;

            background: #f9f7f6;
        }

        .button-container {
            display: flex;

            width: 100%;
            height: 70px;

            overflow: hidden;

            border-radius: 3px;

            background: #f45112;

            box-shadow:
                0 2px 7px rgba(0, 0, 0, 0.2);
        }

        .bottom-btn {
            position: relative;

            width: 50%;
            height: 70px;

            padding-top: 38px;

            border: none;

            background: transparent;

            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        .bottom-btn:first-child {
            border-right:
                1px solid rgba(255, 255, 255, 0.2);
        }

        .bottom-btn:hover {
            background:
                rgba(0, 0, 0, 0.05);
        }


        /* ================================
           BUTTON ICONS
        ================================= */
        .btn-icon {
            position: absolute;

            top: 8px;
            left: 50%;

            transform: translateX(-50%);

            width: 36px;
            height: 36px;

            border:
                3px solid rgba(255, 255, 255, 0.7);

            border-radius: 50%;
        }


        /* Cancel Icon */
        .cancel-icon::before {
            content: "/";

            position: absolute;

            top: -6px;
            left: 8px;

            color: white;
            font-size: 36px;
            font-weight: normal;
        }


        /* Next Icon */
        .next-icon::before {
            content: "➜";

            position: absolute;

            top: 3px;
            left: 4px;

            color: white;
            font-size: 22px;
        }


        /* ================================
           RESPONSIVE DESIGN
        ================================= */
        @media (max-width: 500px) {

            .header {
                font-size: 17px;
            }

            .form-card {
                margin: 20px 10px;
            }

            .bottom-bar {
                padding-left: 10px;
                padding-right: 10px;
            }
        }

    </style>
</head>


<body>

    <!-- ================================
         MAIN PAGE
    ================================= -->

    <main class="page">


        <!-- ================================
             PAGE HEADER
        ================================= -->

        <header class="header">
            Existing Account Holders
        </header>


        <!-- ================================
             FORM
        ================================= -->

        <section class="form-card">


            <!-- ================================
                 ACCOUNT TYPE
            ================================= -->

            <div class="form-group">

                <label for="accountType">
                    Account type
                </label>


                <div class="select-wrapper">

                    <div class="info-icon">
                        i
                    </div>


                    <select
                        id="accountType"
                        name="accountType"
                        class="account-type-select"
                    >

                        <option
                            value=""
                            selected
                            disabled
                        >
                            Select Item
                        </option>


                        <option value="individual">
                            Individual
                        </option>


                        <option value="sole-proprietorship">
                            Sole Proprietorship
                        </option>

                    </select>


                    <span class="select-arrow">
                        ▼
                    </span>

                </div>

            </div>


            <!-- ================================
                 MOBILE NUMBER
            ================================= -->

            <div class="form-group">

                <label for="mobileNumber">
                    Mobile Number
                </label>


                <input
                    type="tel"
                    id="mobileNumber"
                    name="mobileNumber"
                    placeholder="e.g. 0201234567"
                >

            </div>


            <!-- ================================
                 ACCOUNT NUMBER
            ================================= -->

            <div class="form-group">

                <label for="accountNumber">
                    Account Number
                </label>


                <input
                    type="text"
                    id="accountNumber"
                    name="accountNumber"
                    placeholder="e.g. 12300190923992"
                >

            </div>


            <!-- ================================
                 TOGGLE OPTIONS
            ================================= -->

            <div class="options">


                <!-- Receive Marketing Info -->

                <div class="option">

                    <label class="switch">

                        <input
                            type="checkbox"
                            id="marketingInfo"
                            checked
                        >

                        <span class="slider"></span>

                    </label>


                    <span class="option-text">
                        Receive marketing info
                    </span>

                </div>


                <!-- Accept EULA -->

                <div class="option">

                    <label class="switch">

                        <input
                            type="checkbox"
                            id="acceptEula"
                        >

                        <span class="slider"></span>

                    </label>


                    <span class="option-text link">
                        Accept EULA
                    </span>

                </div>


                <!-- Accept Terms -->

                <div class="option">

                    <label class="switch">

                        <input
                            type="checkbox"
                            id="acceptTerms"
                        >

                        <span class="slider"></span>

                    </label>


                    <span class="option-text link">
                        Accept Terms And Conditions
                    </span>

                </div>


            </div>


        </section>


    </main>


    <!-- ================================
         BOTTOM BUTTONS
    ================================= -->

    <div class="bottom-bar">


        <div class="button-container">


            <!-- Cancel Button -->

            <button
                type="button"
                class="bottom-btn"
                onclick="cancelForm()"
            >

                <span
                    class="btn-icon cancel-icon"
                ></span>

                Cancel

            </button>


            <!-- Next Button -->

            <button
                type="button"
                class="bottom-btn"
                onclick="nextPage()"
            >

                <span
                    class="btn-icon next-icon"
                ></span>

                Next

            </button>


        </div>


    </div>


    <!-- ================================
         JAVASCRIPT
    ================================= -->

    <script>

        /*
        --------------------------------
        CANCEL FORM
        --------------------------------
        */

        function cancelForm() {

            // Reset account type
            document
                .getElementById("accountType")
                .selectedIndex = 0;


            // Clear mobile number
            document
                .getElementById("mobileNumber")
                .value = "";


            // Clear account number
            document
                .getElementById("accountNumber")
                .value = "";


            // Reset marketing information
            document
                .getElementById("marketingInfo")
                .checked = true;


            // Reset EULA
            document
                .getElementById("acceptEula")
                .checked = false;


            // Reset terms
            document
                .getElementById("acceptTerms")
                .checked = false;

        }


        /*
        --------------------------------
        NEXT PAGE
        --------------------------------
        */

        function nextPage() {

            const accountType =
                document.getElementById("accountType").value;

            const mobileNumber =
                document.getElementById("mobileNumber").value;

            const accountNumber =
                document.getElementById("accountNumber").value;

            const acceptEula =
                document.getElementById("acceptEula").checked;

            const acceptTerms =
                document.getElementById("acceptTerms").checked;


            // Validate account type
            if (accountType === "") {

                alert("Please select an account type.");

                return;

            }


            // Validate mobile number
            if (mobileNumber.trim() === "") {

                alert("Please enter your mobile number.");

                return;

            }


            // Validate account number
            if (accountNumber.trim() === "") {

                alert("Please enter your account number.");

                return;

            }


            // Validate EULA
            if (!acceptEula) {

                alert(
                    "Please accept the EULA to continue."
                );

                return;

            }


            // Validate Terms and Conditions
            if (!acceptTerms) {

                alert(
                    "Please accept the Terms and Conditions to continue."
                );

                return;

            }


            // Display confirmation
            alert(

                "Account Type: " + accountType +

                "\nMobile Number: " + mobileNumber +

                "\nAccount Number: " + accountNumber

            );

        }

    </script>

</body>
</html>
